name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-test:
    timeout-minutes: 10
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: 26
          distribution: temurin
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn --batch-mode -DskipTests package

      - name: Run local tests
        run: mvn --batch-mode verify -Pweb-execution -Dsuite=local -Dtarget=local -Dheadless=true -Dbrowser=chrome

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            allure-results/
            target/allure-results/

  selenium-grid-test:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: macos-latest
    needs: local-test

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: 26
          distribution: temurin
          cache: maven

      - name: Start Selenium Grid
        working-directory: grid
        run: docker compose up -d

      - name: Wait for Selenium Grid
        run: |
          for i in {1..30}; do
            if curl -fsSL http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenium Grid is ready"
              exit 0
            fi
          
            echo "Waiting for Selenium Grid..."
            sleep 2
          done
          
          echo "Selenium Grid did not become ready in time"
          docker compose -f grid/docker-compose.yml logs
          exit 1

      - name: Run Selenium Grid tests
        run: mvn --batch-mode verify -Pweb-execution -Dsuite=selenium-grid -Dtarget=grid -Dheadless=true -Dgrid.url=http://localhost:4444

      - name: Upload Grid test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-selenium-grid
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            allure-results/
            target/allure-results/

      - name: Stop Selenium Grid
        if: always()
        working-directory: grid
        run: docker compose down --volumes --remove-orphans